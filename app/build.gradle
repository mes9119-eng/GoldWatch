plugins { id 'com.android.application' }

android {
    namespace 'com.assiss.goldwatch'
    compileSdk 34
    defaultConfig {
        applicationId 'com.assiss.goldwatch'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '2.1'
    }
    signingConfigs {
        fixed {
            storeFile file('goldwatch.keystore')
            storePassword 'goldwatch123'
            keyAlias 'goldwatch'
            keyPassword 'goldwatch123'
        }
    }
    flavorDimensions 'edition'
    productFlavors {
        standard {
            dimension 'edition'
            resValue 'string', 'dedication', ''
        }
        ali {
            dimension 'edition'
            applicationIdSuffix '.ali'
            resValue 'string', 'dedication', 'للعميد / علي العمري'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
